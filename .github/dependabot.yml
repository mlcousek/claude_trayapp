version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      microsoft:
        patterns:
          - "Microsoft.Extensions.*"
          - "Microsoft.Data.Sqlite"
      serilog:
        patterns:
          - "Serilog*"
      tests:
        patterns:
          - "xunit*"
          - "Shouldly"
          - "NSubstitute"
          - "Microsoft.NET.Test.Sdk"
    ignore:
      # The app targets net9.0. Stay on the 9.0.x line of these packages until the TFM moves.
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Data.Sqlite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Serilog.Extensions.Hosting"
        update-types: ["version-update:semver-major"]
      # H.NotifyIcon.Wpf 2.4 dropped net9.0-windows; 2.3.x is the last line that targets it.
      - dependency-name: "H.NotifyIcon.Wpf"
        versions: [">=2.4.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
